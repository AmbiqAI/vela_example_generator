; Vela system configuration for Atomiq AT110 (Ethos-U85-256), generated by helia_npu.vela.system_config
; from the packaged SoC definition socs/atomiq110.yaml (v7 (2026-09-18)).
; Use:  vela --config at110_vela.ini --system-config atomiq110_HP --memory-mode Shared_Sram --accelerator-config ethos-u85-256 <model.tflite>
; Axi0 = SSRAM (250 MHz fabric, 64 ns), Axi1 = HBLRAM (88 ns). Latencies are in NPU cycles for each mode's clock.
; Known open item: Sram_ports_used=2 assumes the NPU spreads SRAM traffic over both of its SRAM ports; under review.

[System_Config.atomiq110_ULP]
core_clock=1e+08
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=256
Sram_read_latency=7
Sram_write_latency=7
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=1.0
Dram_ports_used=1
Dram_burst_length=256
Dram_read_latency=9
Dram_write_latency=9
Dram_max_reads=12
Dram_max_writes=12

[System_Config.atomiq110_HP]
core_clock=5e+08
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=0.5
Sram_ports_used=2
Sram_burst_length=256
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.5
Dram_ports_used=1
Dram_burst_length=256
Dram_read_latency=44
Dram_write_latency=44
Dram_max_reads=12
Dram_max_writes=12

; Memory Modes (Axi0 = SSRAM, Axi1 = HBLRAM/RRAM/PSRAM)

[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0

[Memory_Mode.Dedicated_Sram]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0

[Memory_Mode.Dedicated_Sram_256KB]
inherit=Memory_Mode.Dedicated_Sram
arena_cache_size=262144

[Memory_Mode.Dedicated_Sram_384KB]
inherit=Memory_Mode.Dedicated_Sram
arena_cache_size=393216

[Memory_Mode.Dedicated_Sram_512KB]
inherit=Memory_Mode.Dedicated_Sram
arena_cache_size=524288
