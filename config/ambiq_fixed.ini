; =============================================================================
; Arm Ethos-U Vela Configuration File
; Optimized for 128-bit AXI Bus Interfaces (0.2 GB/s target bandwidth)
; =============================================================================

; -----------------------------------------------------------------------------
; Low-Power (LP) Core Configurations (100 MHz Core Clock)
; -----------------------------------------------------------------------------
; Sram_clock_scale=2.5, Dram_clock_scale=0.125
[System_Config.AmbiqLP_SRAM]
core_clock=100e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=2.5
Sram_ports_used=2
Dram_clock_scale=0.125
Dram_ports_used=2

[System_Config.AmbiqLP_HBLRAM]
core_clock=100e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=2.5
Sram_ports_used=2
Dram_clock_scale=0.125
Dram_ports_used=1

[System_Config.AmbiqLP_PSRAM]
core_clock=100e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=2.5
Sram_ports_used=2
Dram_clock_scale=0.125
Dram_ports_used=1

; -----------------------------------------------------------------------------
; High-Performance (HP) Core Configurations (500 MHz Core Clock)
; -----------------------------------------------------------------------------
; Sram_clock_scale=0.5, Dram_clock_scale=0.025
[System_Config.AmbiqHP_SRAM]
core_clock=500e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=0.5
Sram_ports_used=2
Dram_clock_scale=0.025
Dram_ports_used=2

[System_Config.AmbiqHP_HBLRAM]
core_clock=500e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=0.5
Sram_ports_used=2
Dram_clock_scale=0.025
Dram_ports_used=1

[System_Config.AmbiqHP_PSRAM]
core_clock=500e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=0.5
Sram_ports_used=2
Dram_clock_scale=0.025
Dram_ports_used=1

; -----------------------------------------------------------------------------
; Memory Mode Profiles (Summary, full profiles available in source)
; -----------------------------------------------------------------------------
[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0

[Memory_Mode.Dedicated_Sram]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0

; Size variants (256KB, 384KB, 512KB, 1MB)
[Memory_Mode.Dedicated_Sram_512KB]
inherit=Memory_Mode.Dedicated_Sram
arena_cache_size=524288

[Memory_Mode.Dedicated_HBLRAM_256MB]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0
arena_cache_size=262144
